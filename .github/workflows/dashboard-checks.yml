name: Dashboard checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dashboard.py"
      - ".streamlit/config.toml"
      - "dashboard_content/**"
      - "dashboard_assets/**"
      - "utils/get_installed_capacity.py"
      - ".github/workflows/offshore-simulation.yml"
      - "utils/weather.py"
      - "utils/offshore/**"
      - ".github/workflows/offshore-daily.yml"
      - "tests/**"
      - "requirements-dashboard.txt"
      - "requirements-offshore-final.txt"
      - "requirements-load.txt"
      - "utils/germany_grid_map.py"
      - "utils/germany_states_low.geojson"
      - "notebooks/research_load_model/**"
      - ".github/workflows/dashboard-checks.yml"
  push:
    branches: [main]
    paths:
      - "dashboard.py"
      - ".streamlit/config.toml"
      - "dashboard_content/**"
      - "dashboard_assets/**"
      - "utils/get_installed_capacity.py"
      - ".github/workflows/offshore-simulation.yml"
      - "utils/weather.py"
      - "utils/offshore/**"
      - ".github/workflows/offshore-daily.yml"
      - "tests/**"
      - "requirements-dashboard.txt"
      - "requirements-offshore-final.txt"
      - "requirements-load.txt"
      - "utils/germany_grid_map.py"
      - "utils/germany_states_low.geojson"
      - "notebooks/research_load_model/**"
      - ".github/workflows/dashboard-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dashboard.txt
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements-dashboard.txt
      - name: Compile dashboard code
        run: python -m compileall -q dashboard.py utils/offshore utils/weather.py
      - name: Run dashboard tests
        run: python -m unittest discover -s tests -p 'test_offshore_dashboard.py' -v

  pipeline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-offshore-final.txt
      - name: Install model runtime
        run: python -m pip install -r requirements-offshore-final.txt
      - name: Run offshore pipeline tests
        run: |
          python -m unittest discover -s tests -p 'test_weather.py' -q
          python -m unittest discover -s tests -p 'test_offshore_daily.py' -q
          python -m unittest discover -s tests -p 'test_offshore_operations.py' -q

  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-load.txt
      - name: Install load preparation dependencies
        run: python -m pip install -r requirements-load.txt
      - name: Run load notebook integration test
        run: python -m unittest discover -s tests -p 'test_load_notebook.py' -v
