name: Dashboard checks

on:
  pull_request:
    paths:
      - "dashboard.py"
      - ".streamlit/config.toml"
      - "dashboard_content/**"
      - "dashboard_assets/**"
      - "utils/offshore_dashboard.py"
      - "utils/offshore_day_ahead.py"
      - "utils/offshore_daily.py"
      - "utils/offshore_simulation.py"
      - "utils/get_installed_capacity.py"
      - ".github/workflows/offshore-simulation.yml"
      - "utils/offshore_final_data.py"
      - "utils/offshore_utils.py"
      - ".github/workflows/offshore-daily.yml"
      - "tests/**"
      - "requirements-dashboard.txt"
      - "requirements-offshore-final.txt"
      - ".github/workflows/dashboard-checks.yml"
  push:
    branches: [main]
    paths:
      - "dashboard.py"
      - ".streamlit/config.toml"
      - "dashboard_content/**"
      - "dashboard_assets/**"
      - "utils/offshore_dashboard.py"
      - "utils/offshore_day_ahead.py"
      - "utils/offshore_daily.py"
      - "utils/offshore_simulation.py"
      - "utils/get_installed_capacity.py"
      - ".github/workflows/offshore-simulation.yml"
      - "utils/offshore_final_data.py"
      - "utils/offshore_utils.py"
      - ".github/workflows/offshore-daily.yml"
      - "tests/**"
      - "requirements-dashboard.txt"
      - "requirements-offshore-final.txt"
      - ".github/workflows/dashboard-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dashboard.txt
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements-dashboard.txt
      - name: Compile dashboard code
        run: python -m compileall dashboard.py utils/offshore_dashboard.py utils/offshore_day_ahead.py
      - name: Run dashboard tests
        run: python -m unittest discover -s tests -p 'test_offshore_dashboard.py' -v

  pipeline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-offshore-final.txt
      - name: Install model runtime
        run: python -m pip install -r requirements-offshore-final.txt
      - name: Run offshore pipeline tests
        run: |
          python -m unittest discover -s tests -p 'test_offshore_daily.py' -q
          python -m unittest discover -s tests -p 'test_offshore_operations.py' -q
