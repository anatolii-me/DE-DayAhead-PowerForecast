name: Offshore daily forecast

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offshore-daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-offshore-final.txt
      - name: Install model runtime
        run: python -m pip install -r requirements-offshore-final.txt
      - name: Refresh, refit and publish artifacts
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m utils.offshore_daily
      - name: Preserve successful source downloads
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/source_cache
          if ! git diff --cached --quiet; then
            git commit -m "Cache refreshed offshore sources"
            git push origin HEAD:main
          fi
      - name: Commit public artifacts
        run: |
          git add dashboard_data
          if ! git diff --cached --quiet; then
            git commit -m "Update offshore day-ahead forecast"
            git push origin HEAD:main
          fi
