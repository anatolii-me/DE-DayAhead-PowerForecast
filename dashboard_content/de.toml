chart_title = "Offshore-Windenergie · Day-Ahead-Prognose und Ist-Werte"
chart_y_axis = "Erzeugung (MW)"
chart_actual = "Tatsächliche Erzeugung"
chart_forecast = "Prognose · XGBoost HPO"
